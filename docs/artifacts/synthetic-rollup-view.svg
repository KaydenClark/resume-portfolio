<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic reporting rollup</title><desc id="desc">A fictional weekly rollup showing three anonymous account groups.</desc>
  <rect width="1600" height="900" fill="#101722"/><rect x="60" y="55" width="1480" height="790" rx="20" fill="#192334" stroke="#33455f" stroke-width="2"/>
  <text x="120" y="135" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Weekly Rollup View</text><text x="120" y="178" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="24">Synthetic sample · normalized reporting categories</text>
  <g font-family="system-ui,sans-serif"><rect x="115" y="235" width="1310" height="72" rx="9" fill="#223149"/><g fill="#aab8cc" font-size="19" font-weight="700"><text x="150" y="280">GROUP</text><text x="600" y="280">PLANNED HOURS</text><text x="900" y="280">ACTUAL HOURS</text><text x="1190" y="280">VARIANCE</text></g>
  <g fill="#f5f7fb" font-size="25"><text x="150" y="390">North</text><text x="630" y="390">128</text><text x="935" y="390">124</text><text x="1205" y="390">−4</text><text x="150" y="500">Central</text><text x="630" y="500">96</text><text x="935" y="500">101</text><text x="1205" y="500">+5</text><text x="150" y="610">West</text><text x="630" y="610">112</text><text x="935" y="610">110</text><text x="1205" y="610">−2</text></g>
  <g fill="#aab8cc" font-size="20"><text x="150" y="710">TOTAL</text><text x="630" y="710">336</text><text x="935" y="710">335</text></g><text x="1205" y="710" fill="#e0bd3e" font-size="20" font-weight="700">−1</text></g>
  <g stroke="#33455f" stroke-width="2"><path d="M115 430H1425"/><path d="M115 540H1425"/><path d="M115 650H1425"/></g><rect x="115" y="745" width="1310" height="45" rx="8" fill="#223149"/><text x="145" y="775" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="18">Illustrative values only; source names and client data are intentionally omitted.</text>
