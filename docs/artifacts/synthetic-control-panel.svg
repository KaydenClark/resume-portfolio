<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic operations control panel</title><desc id="desc">A fictional workbook dashboard showing validation status and period controls.</desc>
  <rect width="1600" height="900" fill="#101722"/><rect x="60" y="55" width="1480" height="790" rx="20" fill="#192334" stroke="#33455f" stroke-width="2"/>
  <text x="120" y="135" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="42" font-weight="700">Operations Control Panel</text><text x="120" y="178" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="24">Synthetic demonstration data · July sample period</text>
  <rect x="115" y="230" width="330" height="100" rx="12" fill="#223149"/><text x="145" y="270" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="20">Reporting period</text><text x="145" y="308" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Jul 01–31</text>
  <rect x="480" y="230" width="330" height="100" rx="12" fill="#1c4c43"/><text x="510" y="270" fill="#bfe9d4" font-family="system-ui,sans-serif" font-size="20">Validation status</text><text x="510" y="308" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Ready to review</text>
  <rect x="845" y="230" width="330" height="100" rx="12" fill="#223149"/><text x="875" y="270" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="20">Data refresh</text><text x="875" y="308" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="30" font-weight="700">08:30 local</text>
  <rect x="1210" y="230" width="210" height="100" rx="12" fill="#e0bd3e"/><text x="1240" y="290" fill="#101722" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Run checks</text>
  <text x="120" y="410" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Workflow gates</text>
  <path d="M280 510H1320" stroke="#53647d" stroke-width="6"/><circle cx="280" cy="510" r="34" fill="#4daa57"/><circle cx="625" cy="510" r="34" fill="#4daa57"/><circle cx="970" cy="510" r="34" fill="#4daa57"/><circle cx="1320" cy="510" r="34" fill="#e0bd3e"/>
  <g fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><text x="280" y="575">Inputs</text><text x="625" y="575">QA checks</text><text x="970" y="575">Rollup</text><text x="1320" y="575">Review</text></g>
  <g fill="#aab8cc" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle"><text x="280" y="612">Complete</text><text x="625" y="612">Passed</text><text x="970" y="612">Generated</text><text x="1320" y="612">Pending</text></g>
  <rect x="115" y="690" width="1305" height="95" rx="12" fill="#223149"/><text x="145" y="747" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="24">Workbook owner</text><text x="420" y="747" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Operations team · synthetic sample</text>
</svg>
