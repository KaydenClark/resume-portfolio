<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic gross profit margin heatmap</title><desc id="desc">A fictional heatmap comparing anonymous account groups across four periods.</desc>
  <rect width="1600" height="900" fill="#101722"/><rect x="60" y="55" width="1480" height="790" rx="20" fill="#192334" stroke="#33455f" stroke-width="2"/>
  <text x="120" y="135" fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="42" font-weight="700">GPM Heatmap</text><text x="120" y="178" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="24">Synthetic margin trend visualization</text>
  <g fill="#aab8cc" font-family="system-ui,sans-serif" font-size="21" font-weight="700"><text x="500" y="270">WEEK 1</text><text x="720" y="270">WEEK 2</text><text x="940" y="270">WEEK 3</text><text x="1160" y="270">WEEK 4</text></g>
  <g fill="#f5f7fb" font-family="system-ui,sans-serif" font-size="25"><text x="160" y="375">North</text><text x="160" y="500">Central</text><text x="160" y="625">West</text></g>
  <g font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><g fill="#4daa57"><rect x="430" y="320" width="170" height="85" rx="9"/><rect x="870" y="320" width="170" height="85" rx="9"/><rect x="1090" y="445" width="170" height="85" rx="9"/><rect x="430" y="570" width="170" height="85" rx="9"/><rect x="650" y="570" width="170" height="85" rx="9"/></g><g fill="#e0bd3e"><rect x="650" y="320" width="170" height="85" rx="9"/><rect x="430" y="445" width="170" height="85" rx="9"/><rect x="870" y="445" width="170" height="85" rx="9"/><rect x="1090" y="570" width="170" height="85" rx="9"/></g><g fill="#cf4f84"><rect x="1090" y="320" width="170" height="85" rx="9"/><rect x="650" y="445" width="170" height="85" rx="9"/><rect x="870" y="570" width="170" height="85" rx="9"/></g><g fill="#101722"><text x="515" y="372">42%</text><text x="735" y="372">39%</text><text x="955" y="372">44%</text><text x="1175" y="372">36%</text><text x="515" y="497">40%</text><text x="735" y="497">35%</text><text x="955" y="497">38%</text><text x="1175" y="497">43%</text><text x="515" y="622">45%</text><text x="735" y="622">41%</text><text x="955" y="622">37%</text><text x="1175" y="622">40%</text></g></g>
  <text x="120" y="750" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="20">Legend</text><rect x="240" y="725" width="28" height="28" rx="5" fill="#4daa57"/><text x="280" y="748" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="18">at or above target</text><rect x="500" y="725" width="28" height="28" rx="5" fill="#e0bd3e"/><text x="540" y="748" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="18">monitor</text><rect x="680" y="725" width="28" height="28" rx="5" fill="#cf4f84"/><text x="720" y="748" fill="#aab8cc" font-family="system-ui,sans-serif" font-size="18">review</text>
</svg>
